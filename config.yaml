# Qwen Image Edit — Apple Silicon (M5) configuration
#
# Every path may use ~ and ${ENV_VAR}. Relative paths resolve against this
# file's directory, so the project stays portable.

model:
  # FLUX.2 Klein 9B at 8-bit, in mflux/MLX format.
  # Accepts a HuggingFace repo id ("org/name") or a local directory.
  #
  # Chosen because every component is quantised — including the text encoder —
  # so the whole 17.9 GB model stays resident on a 24 GB machine.
  #
  # Qwen-Image-Edit is still supported (family: qwen-image-edit), but mflux
  # keeps its text encoder at bf16, which puts the working set at ~32 GB and
  # causes heavy swapping below 40 GB of memory. Measured on an M5/24 GB:
  # 116 s per denoise step, versus a few seconds for this model.
  repo_id: "mlx-community/flux2-klein-9b-8bit"

  # Which mflux pipeline drives this repo. See src/families.py.
  family: "flux2-klein-edit"

  # Models offered in the UI's picker and via `--model <id>`. Switching is a
  # runtime operation: the current model is unloaded and the new one loaded,
  # so no restart is needed. Weights download on first selection.
  #
  # `repo_id` and `family` must match — the weights and the pipeline that
  # drives them are a pair. Startup validates this.
  catalog:
    - id: "flux2-klein-9b"
      label: "FLUX.2 Klein 9B (8-bit)"
      repo_id: "mlx-community/flux2-klein-9b-8bit"
      family: "flux2-klein-edit"
      notes: "Best quality that fits a 24 GB machine. Recommended."
    - id: "flux2-klein-4b"
      label: "FLUX.2 Klein 4B (6-bit)"
      repo_id: "mlx-community/FLUX.2-Klein-4B-6bit"
      family: "flux2-klein-edit-4b"
      notes: "Fastest. Lower fidelity; good for exploring wording."
    - id: "qwen-6bit"
      label: "Qwen-Image-Edit 2509 (6-bit)"
      repo_id: "OsaurusAI/Qwen-Image-Edit-mflux-q6"
      family: "qwen-image-edit"
      notes: "Needs 40 GB+. On 24 GB it swaps badly — ~116 s per step."

  # Which catalog entry to start with. Defaults to whatever repo_id names.
  active: "flux2-klein-9b"

  # Where weights are cached. This becomes HF_HOME, so downloads land inside
  # the project instead of ~/.cache/huggingface. ~18 GB on first launch.
  cache_dir: "./models/hf"

  # Bit width is read from the model's own safetensors metadata. Leave null to
  # honour it. Setting an int here is ignored for pre-quantized weights.
  quantize: null

  # Download at import time instead of on first edit.
  preload: false

  # Optional LoRA adapters applied to the transformer.
  # lora_paths:  ["lightx2v/Qwen-Image-Lightning"]
  # lora_scales: [0.5]
  lora_paths: []
  lora_scales: []

memory:
  # How to manage the working set.
  #
  #   auto      Pick per model: `balanced` when the model fits in memory,
  #             `low` when it does not. Correct as you switch models.
  #   balanced  Keep every component resident — no eviction, no reload.
  #   low       Evict the text encoder after each prompt encode and lazily
  #             reload it next turn. Only worth the reload cost when the model
  #             does not fit (e.g. qwen-image-edit on under ~40 GB).
  #   off       No management at all.
  mode: "auto"

  # Cap on MLX's buffer cache, in bytes; null leaves MLX's default.
  #
  # Only applied in `low` mode on unified memory. MLX reuses freed buffers from
  # this cache, so capping it forces a real allocator round-trip every step —
  # cheap on Apple Silicon, but expensive and fragmenting on a discrete GPU
  # where each reclaim is a cudaFreeAsync/cudaMallocAsync pair. It is therefore
  # never applied on CUDA.
  cache_limit_bytes: 1073741824

  # Tile VAE encode/decode to cap activation memory at high resolutions.
  vae_tiling: true

generation:
  # Defaults for the UI. Everything here is overridable per-edit.
  # FLUX.2 wants guidance near 1.0 — unlike Qwen, which likes ~4.0. It also
  # rejects a negative prompt entirely; describe what you want instead.
  steps: 28
  guidance: 1.0
  # null = derive from the input image's aspect ratio at ~1 megapixel.
  width: null
  height: null
  negative_prompt: ""
  scheduler: "flow_match_euler_discrete"

  # Resolution presets offered in the UI.
  #
  # Presets with `megapixels` preserve the source aspect ratio and size to that
  # pixel budget — the right default, because forcing a square output on a
  # non-square photo stretches it. Presets with explicit width/height are for
  # deliberately reframing to a different shape.
  resolution_presets:
    - { label: "Draft — match input, 0.3 MP", megapixels: 0.3 }
    - { label: "Balanced — match input, 0.6 MP", megapixels: 0.6 }
    - { label: "Quality — match input, 1.0 MP", megapixels: 1.0 }
    - { label: "Square — 768 x 768", width: 768, height: 768 }
    - { label: "Square — 1024 x 1024", width: 1024, height: 1024 }
    - { label: "Portrait — 768 x 1024", width: 768, height: 1024 }
    - { label: "Landscape — 1024 x 768", width: 1024, height: 768 }

  # Shown in the UI as the recommended starting point for this machine.
  m5_recommended:
    steps: 28
    guidance: 1.0
    preset: "Balanced — match input, 0.6 MP"

output:
  dir: "./outputs"
  # Written next to each PNG: prompt, seed, steps, guidance, timing.
  save_metadata: true
  # Persist edit sessions so they survive an app restart.
  save_sessions: true
  format: "png"

ui:
  title: "Local Image Edit — M5"
  server_name: "127.0.0.1"
  server_port: 7860
  share: false
  # Open the browser automatically on launch.
  inbrowser: true
  # Preset one-tap instructions shown under the composer.
  style_presets:
    - { label: "Cinematic", prompt: "Turn this photo into a cinematic still with dramatic lighting, film grain, and shallow depth of field. Keep the subject and composition unchanged." }
    - { label: "Golden hour", prompt: "Relight the scene with warm golden-hour sunlight and long soft shadows. Keep everything else unchanged." }
    - { label: "Watercolour", prompt: "Repaint this image as a soft watercolour illustration with visible paper texture and loose edges." }
    - { label: "Remove background", prompt: "Remove the background entirely and replace it with a clean, evenly lit plain white studio backdrop. Keep the subject exactly as it is." }
    - { label: "Black & white", prompt: "Convert to a high-contrast black and white photograph with deep blacks and bright highlights." }
    - { label: "Enhance", prompt: "Improve the overall quality: sharpen detail, fix exposure, and balance colour. Do not change any content." }

logging:
  # DEBUG | INFO | WARNING | ERROR
  level: "INFO"
  file: "./outputs/app.log"

api:
  # Local REST endpoints (POST /api/edit) mounted alongside the Gradio app.
  enabled: true
